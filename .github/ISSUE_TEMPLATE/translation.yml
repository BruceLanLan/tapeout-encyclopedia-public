name: Translation
description: Request or offer a translation of an existing entry
title: "i18n: "
labels: ["i18n", "content"]
body:
  - type: input
    id: slug
    attributes:
      label: Existing slug
      placeholder: nand
    validations:
      required: true
  - type: input
    id: from_locale
    attributes:
      label: From locale
      placeholder: zh
    validations:
      required: true
  - type: input
    id: to_locale
    attributes:
      label: To locale
      placeholder: en
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for translators
      description: Terms to keep in Latin script, safety boundaries, etc.
